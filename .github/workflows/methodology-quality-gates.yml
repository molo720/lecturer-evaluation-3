name: Methodology quality gates

on:
  pull_request:
  push:
    branches: [main, review-methodology-tests]

jobs:
  production-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest Flask==3.1.3 Flask-WTF==1.3.0 nltk==3.10.3 numpy pandas scikit-learn==1.9.1 joblib==1.6.0
      - name: Prepare NLTK resources
        run: |
          python - <<'PY'
          import nltk
          for resource in ("stopwords", "punkt", "punkt_tab"):
              nltk.download(resource, quiet=True)
          PY
      - name: Test production analysis and family split
        run: python -m pytest -q tests/test_ml_engine_regressions.py tests/test_template_family_holdout.py
